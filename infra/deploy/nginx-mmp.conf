# mmp.adaptsmedia.info — tracking endpoints go to the tracker, everything else
# to the dashboard. The business API stays internal: the dashboard reaches it
# over the compose network with the user's own session.
#
# X-Forwarded-For is *set*, not appended: the services trust its left-most entry
# for rate limiting, so a client-supplied value must never survive this hop.

upstream mmp_tracker { server 127.0.0.1:8001; keepalive 32; }
upstream mmp_web     { server 127.0.0.1:8003; keepalive 16; }

server {
    server_name mmp.adaptsmedia.info;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API only marks cookies Secure in "prod", which needs AWS KMS. The site
    # is HTTPS-only, so add the flag here.
    proxy_cookie_flags ~ secure;

    location /c/                                  { proxy_pass http://mmp_tracker; }
    location = /v1/events                         { proxy_pass http://mmp_tracker; }
    location = /v1/s2s/events                     { proxy_pass http://mmp_tracker; }
    location = /v1/deeplink/resolve               { proxy_pass http://mmp_tracker; }
    location = /v1/skan/conversion-values         { proxy_pass http://mmp_tracker; }
    location /.well-known/skadnetwork/            { proxy_pass http://mmp_tracker; }

    location / {
        proxy_pass http://mmp_web;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mmp.adaptsmedia.info/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mmp.adaptsmedia.info/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = mmp.adaptsmedia.info) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mmp.adaptsmedia.info;
    return 404; # managed by Certbot


}