// Standalone build so the SDK's Kotlin can be compiled and checked on its own,
// without a host React Native app. In a real integration the host app's
// settings.gradle includes this module through autolinking instead.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "mmp-react-native"
