[project]
name = "mmp-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121", "uvicorn[standard]>=0.38", "mmp-core", "mmp-crypto", "mmp-db", "mmp-attrib"]

[tool.uv.sources]
mmp-core = { workspace = true }
mmp-crypto = { workspace = true }
mmp-db = { workspace = true }
mmp-ingest = { workspace = true }
mmp-attrib = { workspace = true }
mmp-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp_api"]
