[project]
name = "mmp"
version = "0.1.0"
description = "Mobile Measurement Platform — Python + Postgres"
requires-python = ">=3.12"
dependencies = [
    "mmp-core",
    "mmp-crypto",
    "mmp-db",
    "mmp-ingest",
    "mmp-attrib",
    "mmp-providers",
    "mmp-tracker",
    "mmp-api",
    "mmp-worker",
    "mmp-web",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "bandit>=1.9",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "anyio>=4.11",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
mmp-core = { workspace = true }
mmp-crypto = { workspace = true }
mmp-db = { workspace = true }
mmp-ingest = { workspace = true }
mmp-attrib = { workspace = true }
mmp-providers = { workspace = true }
mmp-tracker = { workspace = true }
mmp-api = { workspace = true }
mmp-worker = { workspace = true }
mmp-web = { workspace = true }

# ---------------------------------------------------------------- lint
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "services"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # bandit-in-ruff
    "ASYNC",     # async correctness
    "C4", "SIM", # comprehensions / simplify
    "RUF",
]
ignore = ["S101"]  # assert is fine in tests; pytest needs it

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

# The single most important lint rule in this repo: no f-string SQL, ever.
[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

# ---------------------------------------------------------------- types
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = []
mypy_path = "packages/mmp_core/src:packages/mmp_crypto/src:packages/mmp_db/src:packages/mmp_ingest/src:packages/mmp_attrib/src:packages/mmp_providers/src:services/tracker/src:services/api/src:services/worker/src:services/web/src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# asyncpg ships no py.typed marker. Named explicitly so that a future untyped
# dependency does not slip in under a blanket ignore_missing_imports.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services", "tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
