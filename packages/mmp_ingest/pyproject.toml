[project]
name = "mmp-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["redis[hiredis]>=5.2,<6", "msgspec>=0.20", "asyncpg>=0.31", "mmp-core"]

[tool.uv.sources]
mmp-core = { workspace = true }
mmp-crypto = { workspace = true }
mmp-db = { workspace = true }
mmp-ingest = { workspace = true }
mmp-attrib = { workspace = true }
mmp-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp_ingest"]
