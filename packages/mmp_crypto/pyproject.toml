[project]
name = "mmp-crypto"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cryptography>=46.0", "argon2-cffi>=25.1", "mmp-core"]

[tool.uv.sources]
mmp-core = { workspace = true }
mmp-crypto = { workspace = true }
mmp-db = { workspace = true }
mmp-ingest = { workspace = true }
mmp-attrib = { workspace = true }
mmp-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp_crypto"]
