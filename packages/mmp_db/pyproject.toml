[project]
name = "mmp-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sqlalchemy[asyncio]>=2.0.44", "asyncpg>=0.31", "alembic>=1.17", "psycopg[binary]>=3.2", "mmp-core"]

[tool.uv.sources]
mmp-core = { workspace = true }
mmp-crypto = { workspace = true }
mmp-db = { workspace = true }
mmp-ingest = { workspace = true }
mmp-attrib = { workspace = true }
mmp-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp_db"]
