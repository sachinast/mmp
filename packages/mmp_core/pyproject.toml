[project]
name = "mmp-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic[email]>=2.12", "pydantic-settings>=2.12", "structlog>=25.5", "orjson>=3.11", "starlette>=0.49", "redis[hiredis]>=5.2,<6"]

[tool.uv.sources]
mmp-core = { workspace = true }
mmp-crypto = { workspace = true }
mmp-db = { workspace = true }
mmp-ingest = { workspace = true }
mmp-attrib = { workspace = true }
mmp-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp_core"]
