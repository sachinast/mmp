name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  MMP_ENVIRONMENT: dev
  MMP_SHUTDOWN_GRACE_SECONDS: "0"
  MMP_DATABASE_URL: postgresql+asyncpg://mmp:mmp@127.0.0.1:5432/mmp_test
  MMP_TEST_OWNER: mmp
  MMP_REDIS_URL: redis://127.0.0.1:6379/1

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mmp
          POSTGRES_PASSWORD: mmp
          POSTGRES_DB: mmp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mmp" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Generate ephemeral test secrets
        run: |
          {
            echo "MMP_API_KEY_PEPPER=$(openssl rand -hex 32)"
            echo "MMP_IP_HASH_PEPPER=$(openssl rand -hex 32)"
            echo "MMP_SESSION_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Migrate the test database
        env:
          PGPASSWORD: mmp
        run: |
          make migrate
          psql -h 127.0.0.1 -U mmp -d mmp_test -f infra/scripts/bootstrap_dev_roles.sql

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy packages services

      - name: Static security scan
        run: uv run bandit -q -r packages services

      - name: Dependency audit
        run: |
          uv export --no-emit-workspace --no-dev --format requirements-txt -q -o audit-requirements.txt
          uv run pip-audit -r audit-requirements.txt --strict

      - name: Tests
        run: uv run pytest

      # The SDK's 96 tests and its typecheck. `make check` has run these
      # locally since the SDK existed; CI never has, because this file was
      # written in Phase 1 and the SDK arrived in Phase 12.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/react-native/package-lock.json
      # `npm ci` rather than the `make sdk-setup` a developer runs: it installs
      # exactly the lockfile and fails if package.json has drifted from it,
      # which is the difference that matters on a machine nobody is watching.
      - name: SDK tests
        env:
          MMP_REQUIRE_SDK: "1"
        run: |
          npm ci --prefix sdks/react-native --no-audit --no-fund
          make sdk

  android:
    name: Compile the Android module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, not the 25 Android Studio bundles: Gradle cannot run on 25.
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # Named explicitly. The action's default is "tools platform-tools", and
          # Google has since removed the long-deprecated `tools` package from its
          # repository — so the default install began failing with "Failed to
          # find package 'tools'" on an unchanged workflow. The build needs
          # platform-tools; Gradle fetches the platform and build tools it wants.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      # MMP_REQUIRE_ANDROID turns the target's "skipped" into a failure. Without
      # it a broken toolchain step above would leave this job green while
      # nothing compiled — which is the failure mode the whole job exists to
      # close, the Kotlin having never been compiled anywhere until now.
      - name: Compile and lint
        env:
          MMP_REQUIRE_ANDROID: "1"
        run: make sdk-android
